<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Indispensable pour un affichage correct sur téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relevé des prix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Relevé des prix — Marché</h1>
    <p class="sous-titre">PrixMarché · mini-observatoire des prix</p>
  </header>

  <main>
    <form method="post" action="#">
      <label for="date">Date du relevé</label>
      <input type="date" id="date" name="date" required>

      <label for="ville">Ville</label>
      <select id="ville" name="ville" required>
        <option value="Yaounde">Yaoundé</option>
        <option value="Douala">Douala</option>
        <option value="Garoua">Garoua</option>
        <option value="Bafoussam">Bafoussam</option>
      </select>

      <label for="marche">Marché</label>
      <input type="text" id="marche" name="marche" placeholder="ex. Mokolo" required>

      <label for="produit">Produit</label>
      <select id="produit" name="produit" required>
        <option value="plantain">Plantain (régime)</option>
        <option value="manioc">Manioc (bassine)</option>
        <option value="riz">Riz (kg)</option>
        <option value="tomate">Tomate (seau)</option>
      </select>

      <label for="prix">Prix (FCFA)</label>
      <input type="number" id="prix" name="prix" min="0" step="25" inputmode="numeric" required>

      <button type="submit">Envoyer</button>
    </form>
  </main>

  <footer>
    <p>TP1 · Programmation Web en Python · ISSEA AS3</p>
  </footer>
</body>
</html>
